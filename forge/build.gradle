plugins {
    id 'com.gradleup.shadow'
}

loom {
    forge {
        mixinConfig "mining_quakes.mixins.json"
        mixinConfig "mining_quakes_forge.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge("net.minecraftforge:forge:$rootProject.forge_version")

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    modApi("me.shedaniel.cloth:cloth-config-forge:${project.cloth_config_version}")

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${project.mixin_extras_version}"))
    implementation(include("io.github.llamalad7:mixinextras-forge:${project.mixin_extras_version}"))

    def embedium = "maven.modrinth:embeddium:${project.embeddium_version}+mc${project.minecraft_version}"
    modCompileOnly(embedium)
    modRuntimeOnly(embedium)

    def conditional_mixin = "me.fallenbreath:conditional-mixin-forge:${project.conditional_mixin_version}"
    include(conditional_mixin)
    modImplementation(conditional_mixin)
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
